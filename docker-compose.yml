services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://messenger:change-me@postgres:5432/messenger
      DATABASE_SSL: "false"
      PUBLIC_BASE_URL: https://chat.example.com
      COOKIE_SECURE: "true"
      ALLOWED_ORIGIN: https://chat.example.com
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
